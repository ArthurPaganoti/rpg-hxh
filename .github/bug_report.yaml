name: "🐛 Bug Report"
description: "Reportar um bug ou problema no sistema"
title: "🐛 [BUG] - <título do problema>"
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: "Descrição do bug"
      description: "Uma descrição clara e concisa do que é o bug"
      placeholder: "O que está acontecendo de errado?"
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: "Como reproduzir"
      description: "Passos para reproduzir o comportamento problemático"
      placeholder: "1. Vá para '...'\n2. Clique em '...'\n3. Role até '...'\n4. Veja o erro"
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: "Comportamento esperado"
      description: "Uma descrição clara e concisa do que você esperava que acontecesse"
      placeholder: "O que deveria acontecer corretamente?"
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: "Comportamento atual"
      description: "O que está acontecendo atualmente"
      placeholder: "Descreva o comportamento atual observado"
    validations:
      required: true

  - type: textarea
    id: technical_context
    attributes:
      label: "Contexto técnico"
      description: "Informações sobre em quais arquivos/módulos o bug provavelmente está localizado ou quais componentes são afetados"
      placeholder: "O bug provavelmente está relacionado ao módulo/arquivo..."
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: "Logs/Screenshots"
      description: "Se aplicável, adicione logs ou capturas de tela para ajudar a explicar o problema"
      placeholder: "Cole os logs ou adicione links para screenshots"
      # render: shell
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: "Ambiente"
      description: "Informações sobre o ambiente onde o bug ocorre"
      placeholder: "- Versão do código/commit: abcd123\n- Outras informações relevantes:"
    validations:
      required: true

  - type: textarea
    id: possible_solution
    attributes:
      label: "Possível solução"
      description: "Se você tiver insights sobre a causa ou solução do problema"
      placeholder: "Acredito que o problema possa ser resolvido fazendo..."
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: "Prioridade sugerida"
      description: "Qual a severidade deste bug?"
      options:
        - Baixa
        - Média
        - Alta
        - Crítica
    validations:
      required: true

  - type: textarea
    id: reference_issues
    attributes:
      label: "Issues relacionadas"
      description: "Issues relacionadas a este bug"
      placeholder: "#Issues IDs"
    validations:
      required: false

  - type: textarea
    id: implementation_pr
    attributes:
      label: "PR de implementação"
      description: "Pull request usado para resolver este bug (preencher após correção)"
      placeholder: "#Pull Request ID"
    validations:
      required: false